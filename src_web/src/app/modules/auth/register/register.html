<div class="flex items-center justify-center h-screen bg-gray-100">
  <div class="bg-white p-8 rounded shadow-md w-96">
    <h2 class="text-2xl font-bold mb-6 text-center">Utwórz nowe konto</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Adres email</label>
        <input id="email" type="email" formControlName="email" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" placeholder="Adres email">
      </div>
      
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Hasło</label>
        <input id="password" type="password" formControlName="password" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500" placeholder="Hasło">
      </div>

      <div class="mb-6">
         <label for="role" class="block text-sm font-medium text-gray-700 mb-1">Rola</label>
         <select id="role" formControlName="role" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
           <option value="Employee">Pracownik</option>
           <option value="Admin">Admin</option>
           <option value="Supplier">Dostawca</option>
         </select>
      </div>

      <div *ngIf="error" class="text-red-500 text-sm mb-4 text-center">
        {{ error }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700 disabled:bg-blue-300">
        Zarejestruj się
      </button>

       <div class="mt-4 text-center">
        <a routerLink="/login" class="text-blue-600 hover:underline text-sm">
          Zaloguj się
        </a>
      </div>
    </form>
  </div>
</div>
