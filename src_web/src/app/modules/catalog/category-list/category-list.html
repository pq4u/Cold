<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800">Kategorie</h2>
    <button (click)="onAdd()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
      Dodaj kategorię
    </button>
  </div>

  <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">Nazwa</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500 text-right">Akcje</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let category of categories" class="hover:bg-gray-50">
          <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ category.name }}</td>
          <td class="px-6 py-4 text-sm text-right">
            <button (click)="onEdit(category)" class="text-blue-600 hover:underline mr-4">Edytuj</button>
            <button (click)="onDelete(category.id!)" class="text-red-600 hover:underline">Usuń</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showForm" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow-lg w-96">
      <h3 class="text-lg font-bold mb-4">{{ isEditing ? 'Edytuj' : 'Dodaj' }} kategorię</h3>
      <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nazwa</label>
          <input type="text" formControlName="name" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Adres URL obrazu</label>
          <input type="text" formControlName="image" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" (click)="cancel()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Anuluj</button>
          <button type="submit" [disabled]="categoryForm.invalid" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-blue-300">
            {{ isEditing ? 'Aktualizuj' : 'Zapisz' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
