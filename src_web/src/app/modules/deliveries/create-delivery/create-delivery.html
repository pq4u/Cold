<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800">Zarejestruj nową dostawę</h2>
    <a routerLink="/deliveries" class="text-blue-600 hover:underline text-sm">Powrót do listy</a>
  </div>

  <div class="bg-white p-6 rounded shadow-sm border border-gray-200">
    <form [formGroup]="deliveryForm" (ngSubmit)="onSubmit()">
      <!-- Header Info -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Numer dostawy</label>
          <input type="text" formControlName="deliveryNumber" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Dostawca</label>
          <select formControlName="supplierId" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            <option value="" disabled>Wybierz dostawcę</option>
            <option *ngFor="let s of suppliers" [value]="s.id">{{ s.email }}</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Data</label>
          <input type="datetime-local" formControlName="deliveryDate" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Uwagi</label>
          <input type="text" formControlName="notes" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <!-- Products List -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold text-gray-700">Produkty</h3>
          <button type="button" (click)="addProduct()" class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200">
            + Dodaj produkt
          </button>
        </div>

        <div formArrayName="products" class="space-y-4">
          <div *ngFor="let product of productForms.controls; let i=index" [formGroupName]="i" class="flex items-end gap-4 p-4 bg-gray-50 rounded border border-gray-200">
             <div class="flex-1">
               <label class="block text-xs font-medium text-gray-500 mb-1">Produkt</label>
               <select formControlName="productId" class="w-full border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                 <option value="" disabled>Wybierz produkt</option>
                 <option *ngFor="let p of products" [value]="p.id">{{ p.name }}</option>
               </select>
             </div>
             <div class="w-64">
               <label class="block text-xs font-medium text-gray-500 mb-1">Cena / Klasa</label>
               <select formControlName="classType" class="w-full border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-blue-500">
                 <option value="" disabled>Wybierz cenę</option>
                 <option *ngFor="let p of getPricesForProduct(product.get('productId')?.value)" [value]="p.classType">
                   {{ p.classType }} - {{ p.price | number:'1.2-2' }}
                 </option>
               </select>
             </div>
             <div class="w-32">
               <label class="block text-xs font-medium text-gray-500 mb-1">Ilość</label>
               <input type="number" formControlName="quantity" class="w-full border border-gray-300 p-2 rounded text-sm focus:outline-none focus:border-blue-500">
             </div>
             <button type="button" (click)="removeProduct(i)" class="text-red-500 hover:text-red-700 p-2">
               &times;
             </button>
          </div>
        </div>
      </div>

      <div class="flex justify-end pt-4 border-t border-gray-200">
        <button type="submit" [disabled]="deliveryForm.invalid" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 disabled:bg-blue-300">
          Zarejestruj dostawę
        </button>
      </div>
    </form>
  </div>
</div>
