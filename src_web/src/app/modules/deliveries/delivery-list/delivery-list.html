<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800">Dostawy</h2>
    <div class="flex items-center space-x-4">
      
      <a routerLink="/deliveries/create" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 text-sm">
        Nowa dostawa
      </a>
    </div>
  </div>

  <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">Numer</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">Data</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">Dostawca</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500 text-right">Wartość</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500 text-right">Akcje</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let delivery of deliveries" class="hover:bg-gray-50">
          <td class="px-6 py-4 text-sm font-medium text-gray-900">{{ delivery.deliveryNumber || '-' }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ delivery.deliveryDate | date:'medium' }}</td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ delivery.supplierId }}</td>
          <td class="px-6 py-4 text-sm text-gray-900 text-right font-medium">{{ delivery.totalValue | number:'1.2-2' }}zł</td>
          <td class="px-6 py-4 text-sm text-center">
            <span [class]="delivery.isInvoiced ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'" class="px-2 py-1 text-xs font-semibold rounded">
              {{ delivery.isInvoiced ? 'Tak' : 'Nie' }}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-right">
             <a [routerLink]="['/deliveries', delivery.id]" class="text-gray-600 hover:underline">Szczegóły</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
