<div class="container mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Zlecenia transportowe</h2>
    <div class="flex items-center space-x-4">
      <form [formGroup]="filterForm" class="flex items-center">
        <label class="mr-2 text-gray-700">Filtruj status:</label>
        <select formControlName="statusId" class="block w-48 bg-white border border-gray-300 rounded-md py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm shadow-sm">
          <option value="">Wszystkie</option>
          <option *ngFor="let s of statuses" [value]="s.id">{{ s.displayName }}</option>
        </select>
      </form>
    </div>
  </div>

  <div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dostawca</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nr dostawy</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Akcje</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let request of requests">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ request.requestDate | date:'shortDate' }}
          </td>
           <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ request.supplierId }}
          </td>
           <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ request.deliveryNumber || '-' }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
              {{ request.transportStatusName }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button (click)="onUpdateStatus(request)" class="text-indigo-600 hover:text-indigo-900">Zaktualizuj status</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Status Update Modal -->
  <div *ngIf="isEditingStatus" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-lg shadow-xl w-96">
      <h3 class="text-xl font-bold mb-4">Zaktualizuj status transportu</h3>
      <form [formGroup]="statusForm" (ngSubmit)="submitStatus()">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Status</label>
          <select formControlName="transportStatusId" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
             <option *ngFor="let s of statuses" [value]="s.id">{{ s.displayName }}</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Rzeczywista data odbioru</label>
          <input type="datetime-local" formControlName="actualPickupDate" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Rzeczywista data dostawy</label>
           <input type="datetime-local" formControlName="actualDeliveryDate" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" (click)="cancelEdit()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Anuluj</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Zapisz</button>
        </div>
      </form>
    </div>
  </div>
</div>
