<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800">Zarządzanie użytkownikami</h2>
  </div>

  <div class="bg-white rounded shadow-sm border border-gray-200 overflow-hidden">
    <table class="w-full text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">Email</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">Rola</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500">ID</th>
          <th class="px-6 py-3 text-sm font-medium text-gray-500 text-right">Akcje</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let user of users" class="hover:bg-gray-50">
          <td class="px-6 py-4 text-sm text-gray-900">{{ user.email }}</td>
          <td class="px-6 py-4 text-sm">
            <span [ngClass]="{
              'bg-purple-100 text-purple-800': user.roles.includes('Admin'),
              'bg-blue-100 text-blue-800': user.roles.includes('Employee'),
              'bg-green-100 text-green-800': user.roles.includes('Supplier')
            }" class="px-2 py-1 text-xs font-semibold rounded">
              {{ user.roles.join(', ') }}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-500">{{ user.id }}</td>
          <td class="px-6 py-4 text-sm text-right">
            <button (click)="openRoleModal(user)" class="text-blue-600 hover:underline">Zmień rolę</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="showRoleModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded shadow-lg w-96">
      <h3 class="text-lg font-bold mb-4">Zmiana roli dla {{ selectedUserEmail }}</h3>
      <form [formGroup]="roleForm" (ngSubmit)="updateRole()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Rola</label>
          <select formControlName="role" class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:border-blue-500">
            <option value="Admin">Admin</option>
            <option value="Employee">Pracownik</option>
            <option value="Supplier">Dostawca</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" (click)="closeRoleModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Anuluj</button>
          <button type="submit" [disabled]="roleForm.invalid" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 disabled:bg-blue-300">
            Zaktualizuj
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
