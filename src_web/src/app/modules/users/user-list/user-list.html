<div class="container mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Users Management</h2>
  </div>

  <div class="bg-white shadow-md rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Role</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let user of users">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            {{ user.email }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            <span [ngClass]="{
              'bg-purple-100 text-purple-800': user.roles.includes('Administrator') || user.roles.includes('Admin'),
              'bg-blue-100 text-blue-800': user.roles.includes('Employee'),
              'bg-green-100 text-green-800': user.roles.includes('Supplier')
            }" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full">
              {{ user.roles.join(', ') }}
            </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            {{ user.id }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button (click)="openRoleModal(user)" class="text-indigo-600 hover:text-indigo-900">Change Role</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Role Update Modal -->
  <div *ngIf="showRoleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full flex items-center justify-center z-50">
    <div class="bg-white p-8 rounded-lg shadow-xl w-96">
      <h3 class="text-xl font-bold mb-4">Change Role for {{ selectedUserEmail }}</h3>
      <form [formGroup]="roleForm" (ngSubmit)="updateRole()">
        <div class="mb-4">
          <label class="block text-gray-700 text-sm font-bold mb-2">Role</label>
          <select formControlName="role" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            <option value="Administrator">Administrator</option>
            <option value="Employee">Employee</option>
            <option value="Supplier">Supplier</option>
          </select>
        </div>
        <div class="flex justify-end space-x-2">
          <button type="button" (click)="closeRoleModal()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</button>
          <button type="submit" [disabled]="roleForm.invalid" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 disabled:bg-indigo-300">
            Update Role
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
