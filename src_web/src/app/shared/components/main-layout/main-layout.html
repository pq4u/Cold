<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md">
    <div class="p-6">
      <h1 class="text-2xl font-bold text-gray-800">Cold App</h1>
    </div>
    <nav class="mt-6">
      <a routerLink="/catalog/categories" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">📁</i> Categories
      </a>
      <a routerLink="/catalog/products" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">📁</i> Products
      </a>
      <a routerLink="/catalog/prices" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">📁</i> Prices
      </a>
      <a routerLink="/deliveries" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">🚚</i> Deliveries
      </a>
      <a routerLink="/packages" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">📦</i> Packages
      </a>
      <a routerLink="/packages/rentals" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">📦</i> rentals
      </a>
      <a routerLink="/users" routerLinkActive="bg-gray-200 text-gray-900" class="block px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">👥</i> Users
      </a>
      <button (click)="logout()" class="w-full text-left px-6 py-3 text-gray-600 hover:bg-gray-100 hover:text-gray-900">
        <i class="mr-2">🚪</i> Logout
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-8">
    <router-outlet></router-outlet>
  </main>
</div>
